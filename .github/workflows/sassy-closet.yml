name: sassy-closet

on:
  push:
    paths:
      - "sassy-closet/**"
      - "data/held.json"
      - ".github/workflows/sassy-closet.yml"
  pull_request:
    paths:
      - "sassy-closet/**"
      - "data/held.json"
      - ".github/workflows/sassy-closet.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sassy-closet
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sassy-closet/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
