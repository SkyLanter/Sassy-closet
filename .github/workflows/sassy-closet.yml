name: sassy-closet

on:
  push:
    paths:
      - "sassy-closet/**"
      - ".github/workflows/sassy-closet.yml"
  pull_request:
    paths:
      - "sassy-closet/**"
      - ".github/workflows/sassy-closet.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sassy-closet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sassy-closet/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
