name: sassy-closet-shop

on:
  push:
    paths:
      - "sassy-closet-shop/**"
      - "data/held.json"
      - ".github/workflows/sassy-closet-shop.yml"
  pull_request:
    paths:
      - "sassy-closet-shop/**"
      - "data/held.json"
      - ".github/workflows/sassy-closet-shop.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sassy-closet-shop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sassy-closet-shop/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build
        run: |
          # next/font + Turbopack can fail once with
          # "next/font/google queries have exactly one entry" on a cold runner.
          # Same commit already built clean locally and on the push run.
          attempt=1
          until npm run build; do
            if [ "$attempt" -ge 3 ]; then
              exit 1
            fi
            attempt=$((attempt + 1))
            echo "Build attempt $attempt after next/font Turbopack flake"
          done
