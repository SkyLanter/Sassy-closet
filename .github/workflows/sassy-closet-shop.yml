name: sassy-closet-shop

on:
  push:
    paths:
      - "sassy-closet-shop/**"
      - ".github/workflows/sassy-closet-shop.yml"
  pull_request:
    paths:
      - "sassy-closet-shop/**"
      - ".github/workflows/sassy-closet-shop.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sassy-closet-shop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sassy-closet-shop/package-lock.json
      - run: npm ci
      - run: npm run build
