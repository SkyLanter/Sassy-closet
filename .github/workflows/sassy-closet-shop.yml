name: sassy-closet-shop

on:
  push:
    paths:
      - "sassy-closet-shop/**"
      - "data/held.json"
      - ".github/workflows/sassy-closet-shop.yml"
  pull_request:
    paths:
      - "sassy-closet-shop/**"
      - "data/held.json"
      - ".github/workflows/sassy-closet-shop.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sassy-closet-shop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sassy-closet-shop/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build
        env:
          NEXT_PUBLIC_SHOP_URL: http://127.0.0.1:4317
        run: |
          # next/font + Turbopack can fail once with
          # "next/font/google queries have exactly one entry" on a cold runner.
          # Same commit already built clean locally and on the push run.
          attempt=1
          until npm run build; do
            if [ "$attempt" -ge 3 ]; then
              exit 1
            fi
            attempt=$((attempt + 1))
            echo "Build attempt $attempt after next/font Turbopack flake"
          done
      - name: Lighthouse-style shop audit
        env:
          SHOP_AUDIT_URL: http://127.0.0.1:4317
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            sudo apt-get update
            wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get install -y /tmp/chrome.deb
          fi
          npx next start --hostname 127.0.0.1 --port 4317 &
          ready=0
          for _ in $(seq 1 40); do
            if curl -sf -o /dev/null http://127.0.0.1:4317/; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "shop did not start"
            exit 1
          fi
          node scripts/audit-shop.mjs
