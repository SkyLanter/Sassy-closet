name: dataset-checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt pytest
      - name: Fixture unit tests
        run: python -m pytest scripts/tests -q
      - name: Intake shop link flags (fixtures, no live intake)
        run: python scripts/intake_shop_link_flags.py --fixture scripts/tests/fixtures/intake_shop_links_clean.json --out out
      - name: HTTP shop link flags (fixtures, no live catalog)
        run: python scripts/http_shop_link_flags.py --fixture scripts/tests/fixtures/shop_link_https_clean.json --out out
      - name: Shop link space or newline flags (fixtures, no live catalog)
        run: python scripts/space_newline_shop_link_flags.py --fixture scripts/tests/fixtures/shop_link_space_clean.json --out out
