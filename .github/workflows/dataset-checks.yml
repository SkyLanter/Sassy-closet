name: dataset-checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt pytest
      - name: Fixture unit tests
        run: python -m pytest scripts/tests -q
      - name: Intake cost drift (fixtures, no live intake)
        run: |
          python scripts/cost_drift.py --fixture scripts/fixtures/cost-drift.json --out out --date 2026-10-15
          python -m pytest scripts/tests/test_cost_drift.py -q
